<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 产品参数智能查询</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #1557b0 100%);
    }
    .login-header {
      padding: 60px 24px 40px;
      text-align: center;
      color: white;
    }
    .login-logo {
      width: 80px; height: 80px;
      background: white;
      border-radius: 20px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .login-title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
    .login-subtitle { font-size: 14px; opacity: 0.9; }
    .login-form {
      flex: 1;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 32px 24px;
    }
    .form-title { font-size: 20px; font-weight: 600; margin-bottom: 28px; }
    .input-group { position: relative; margin-bottom: 18px; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: var(--text-tertiary);
    }
    .form-input-icon {
      width: 100%; padding: 14px 14px 14px 44px;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: 15px; transition: border-color 0.2s;
    }
    .form-input-icon:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
    .login-btn {
      width: 100%; padding: 14px; margin-top: 28px;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: white; border: none; border-radius: var(--radius-md);
      font-size: 17px; font-weight: 600; cursor: pointer;
      transition: transform 0.15s;
    }
    .login-btn:active { transform: scale(0.98); }
    .demo-hint {
      margin-top: 20px; padding: 12px; background: var(--primary-bg);
      border-radius: var(--radius-sm); font-size: 12px; color: var(--primary);
      text-align: center; line-height: 1.8;
    }
    .role-select {
      display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
    }
    .role-btn {
      flex: 1; min-width: 80px; padding: 10px 8px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: white; cursor: pointer; text-align: center;
      font-size: 13px; transition: all 0.2s;
    }
    .role-btn.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
    .role-btn-icon { font-size: 20px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-header">
      <div class="login-logo">🔍</div>
      <div class="login-title">产品参数智能查询</div>
      <div class="login-subtitle">输入型号 · 秒出参数 · 快做报价</div>
    </div>
    <div class="login-form">
      <div class="form-title">用户登录</div>
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input class="form-input-icon" id="phoneInput" type="tel" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input class="form-input-icon" id="codeInput" type="text" placeholder="请输入验证码" maxlength="6">
      </div>

      <div style="margin-top:16px;font-size:13px;color:var(--text-secondary)">选择演示角色：</div>
      <div class="role-select" id="roleSelect">
        <div class="role-btn active" data-user="u002" onclick="selectRole(this)">
          <div class="role-btn-icon">👨‍💻</div>
          <div>李明(业务员)</div>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
      <div class="demo-hint">
        💡 演示模式：选择角色后直接点击登录<br>
        无需输入手机号和验证码<br>
        <a href="admin/index.html" style="color:var(--primary);text-decoration:underline;font-size:11px">管理员/工程师请点此进入后台 →</a>
      </div>
    </div>
  </div>

  <script src="scripts/utils.js"></script>
  <script src="scripts/mock-data.js"></script>
  <script src="scripts/storage.js"></script>
  <script>
    let selectedUserId = 'u002';

    function selectRole(el) {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedUserId = el.dataset.user;
    }

    function handleLogin() {
      // 初始化模拟数据
      initAllData();

      // 获取选中的用户
      const user = MockData.users.find(u => u.id === selectedUserId);
      if (!user) {
        Utils.toast('用户不存在');
        return;
      }

      UserStorage.save(user);
      Utils.toast('登录成功');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }

    // 如果已登录直接跳转
    if (UserStorage.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
