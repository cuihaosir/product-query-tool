<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>统计分析 - 产品参数智能查询</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    .dark-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 20px 16px 56px; color: white;
    }
    .header-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .total-card {
      background: rgba(255,255,255,0.08); border-radius: var(--radius-md);
      padding: 18px; text-align: center; backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .total-label { font-size: 13px; opacity: 0.8; margin-bottom: 6px; }
    .total-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
    .total-sub { font-size: 12px; opacity: 0.7; margin-top: 4px; }

    .kpi-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin: -36px 16px 14px;
      position: relative; z-index: 10;
    }
    .kpi-card {
      background: white; border-radius: var(--radius-md);
      padding: 14px; box-shadow: var(--shadow-md);
    }
    .kpi-icon { font-size: 20px; margin-bottom: 4px; }
    .kpi-value { font-size: 20px; font-weight: 700; }
    .kpi-label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .kpi-change { font-size: 11px; margin-top: 4px; }

    .section-card {
      background: white; border-radius: var(--radius-lg);
      padding: 16px; margin: 12px 16px; box-shadow: var(--shadow-sm);
    }
    .section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }

    /* 简易柱状图 */
    .bar-chart { margin-top: 8px; }
    .bar-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .bar-label { font-size: 12px; color: var(--text-secondary); width: 80px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 24px; background: var(--bg-page); border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill {
      height: 100%; border-radius: 4px; display: flex; align-items: center;
      padding-left: 8px; font-size: 11px; color: white; font-weight: 500;
      transition: width 0.8s ease;
    }
    .bar-count { font-size: 12px; color: var(--text-tertiary); width: 30px; text-align: right; }

    /* 漏斗 */
    .funnel-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .funnel-item:last-child { border-bottom: none; }
    .funnel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .funnel-label { flex: 1; font-size: 13px; }
    .funnel-value { font-size: 15px; font-weight: 600; }
    .funnel-pct { font-size: 11px; color: var(--text-tertiary); width: 40px; text-align: right; }

    /* 排行列表 */
    .rank-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .rank-item:last-child { border-bottom: none; }
    .rank-num {
      width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .rank-num.top { background: var(--primary); color: white; }
    .rank-num.normal { background: var(--bg-page); color: var(--text-tertiary); }
    .rank-name { flex: 1; font-size: 13px; }
    .rank-value { font-size: 13px; font-weight: 600; color: var(--primary); }

    /* 缺口提醒 */
    .gap-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .gap-item:last-child { border-bottom: none; }
    .gap-keyword { flex: 1; font-size: 13px; font-weight: 500; }
    .gap-count { font-size: 12px; color: var(--error); background: #fff2f0; padding: 2px 8px; border-radius: 10px; }
    .gap-action {
      font-size: 12px; color: var(--primary); cursor: pointer; padding: 2px 8px;
      border: 1px solid var(--primary); border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="navbar" style="position:absolute;top:0;left:0;right:0;background:transparent;border:none;z-index:20;color:white">
      <button class="navbar-back" onclick="location.href='dashboard.html'" style="color:white">‹</button>
      <div class="navbar-title" style="color:white">统计分析</div>
      <div style="width:32px"></div>
    </div>

    <div class="dark-header" style="padding-top:56px">
      <div class="header-title">📊 数据看板</div>
      <div class="total-card">
        <div class="total-label">查询成功率</div>
        <div class="total-value" id="successRate">95%</div>
        <div class="total-sub">基于最近30天数据统计</div>
      </div>
    </div>

    <!-- KPI卡片 -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">🔍</div>
        <div class="kpi-value" id="kpiTotalQuery">156</div>
        <div class="kpi-label">累计查询次数</div>
        <div class="kpi-change trend-up">↑ +23% 较上周</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⏱️</div>
        <div class="kpi-value" id="kpiAvgTime">1.2s</div>
        <div class="kpi-label">平均响应时间</div>
        <div class="kpi-change trend-up">↑ 优于目标</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">📋</div>
        <div class="kpi-value" id="kpiQuoteCount">28</div>
        <div class="kpi-label">本月报价单</div>
        <div class="kpi-change trend-up">↑ +15%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">💰</div>
        <div class="kpi-value" id="kpiQuoteAmount">¥3.2万</div>
        <div class="kpi-label">报价总金额</div>
        <div class="kpi-change trend-up">↑ +8%</div>
      </div>
    </div>

    <!-- 热门查询型号 -->
    <div class="section-card">
      <div class="section-title">🔥 热门查询型号 Top5</div>
      <div class="bar-chart" id="hotQueryChart"></div>
    </div>

    <!-- 报价转化漏斗 -->
    <div class="section-card">
      <div class="section-title">🔄 报价转化漏斗</div>
      <div id="funnelChart"></div>
    </div>

    <!-- 活跃用户排行 -->
    <div class="section-card">
      <div class="section-title">👥 活跃用户排行</div>
      <div id="userRank"></div>
    </div>

    <!-- 知识缺口提醒 -->
    <div class="section-card">
      <div class="section-title">⚠️ 知识缺口提醒</div>
      <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:10px">以下关键词查询频率高但无匹配结果，建议补充知识库</div>
      <div id="gapList"></div>
    </div>

    <div style="height:20px"></div>

    <!-- 底部Tab -->
    <div class="tabbar">
      <a href="dashboard.html" class="tabbar-item">
        <div class="tabbar-icon">🏠</div><div>首页</div>
      </a>
      <a href="chat.html" class="tabbar-item">
        <div class="tabbar-icon">🔍</div><div>查询</div>
      </a>
      <a href="quote.html" class="tabbar-item">
        <div class="tabbar-icon">📋</div><div>报价</div>
      </a>
      <a href="knowledge.html" class="tabbar-item">
        <div class="tabbar-icon">📚</div><div>知识库</div>
      </a>
      <a href="analytics.html" class="tabbar-item active">
        <div class="tabbar-icon">📊</div><div>统计</div>
      </a>
    </div>
  </div>

  <script src="scripts/utils.js"></script>
  <script src="scripts/mock-data.js"></script>
  <script src="scripts/storage.js"></script>
  <script>
    if (!UserStorage.isLoggedIn()) { window.location.href = 'index.html'; }
    initAllData();

    // 模拟统计数据
    const queryStats = QueryRecordStorage.getStats();
    document.getElementById('successRate').textContent = queryStats.successRate + '%';
    document.getElementById('kpiTotalQuery').textContent = queryStats.total + Math.floor(Math.random() * 100 + 50);

    // 热门查询柱状图
    const hotQueries = [
      { name: '6205-2RS', count: 45 },
      { name: '6206-2RS', count: 38 },
      { name: 'M8x30', count: 32 },
      { name: '32207', count: 28 },
      { name: 'YE2-90L-4', count: 22 }
    ];
    const maxCount = Math.max(...hotQueries.map(h => h.count));
    const colors = ['#1a73e8', '#4a9af5', '#ff8c00', '#52c41a', '#722ed1'];
    document.getElementById('hotQueryChart').innerHTML = hotQueries.map((h, i) => `
      <div class="bar-row">
        <div class="bar-label">${h.name}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${h.count/maxCount*100}%;background:${colors[i]}">${h.count}次</div>
        </div>
      </div>
    `).join('');

    // 报价转化漏斗
    const funnelData = [
      { label: '查询产品', value: 156, color: '#1890ff' },
      { label: '加入报价单', value: 68, color: '#52c41a' },
      { label: '发送客户', value: 42, color: '#faad14' },
      { label: '客户确认', value: 18, color: '#eb2f96' },
      { label: '转为订单', value: 12, color: '#722ed1' }
    ];
    document.getElementById('funnelChart').innerHTML = funnelData.map((f, i) => {
      const pct = i === 0 ? '100%' : Math.round(f.value / funnelData[0].value * 100) + '%';
      return `
        <div class="funnel-item">
          <div class="funnel-dot" style="background:${f.color}"></div>
          <div class="funnel-label">${f.label}</div>
          <div class="funnel-value">${f.value}</div>
          <div class="funnel-pct">${pct}</div>
        </div>
      `;
    }).join('');

    // 用户排行
    const userRankData = [
      { name: '李明', dept: '销售部', count: 68 },
      { name: '王芳', dept: '销售部', count: 52 },
      { name: '陈工', dept: '技术部', count: 36 },
      { name: '张伟', dept: '管理层', count: 12 }
    ];
    document.getElementById('userRank').innerHTML = userRankData.map((u, i) => `
      <div class="rank-item">
        <div class="rank-num ${i < 3 ? 'top' : 'normal'}">${i + 1}</div>
        <div class="rank-name">${u.name} <span style="font-size:11px;color:var(--text-tertiary)">${u.dept}</span></div>
        <div class="rank-value">${u.count}次查询</div>
      </div>
    `).join('');

    // 知识缺口
    const gapData = [
      { keyword: 'SKF 6205', count: 8 },
      { keyword: 'NSK轴承', count: 6 },
      { keyword: '不锈钢304螺栓', count: 5 },
      { keyword: 'YE3电机', count: 4 },
      { keyword: '氟橡胶油封', count: 3 }
    ];
    document.getElementById('gapList').innerHTML = gapData.map(g => `
      <div class="gap-item">
        <div class="gap-keyword">"${g.keyword}"</div>
        <div class="gap-count">${g.count}次未命中</div>
        <span class="gap-action" onclick="Utils.toast('已通知管理员补充')">补充</span>
      </div>
    `).join('');
  </script>
</body>
</html>
