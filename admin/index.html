<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - 产品参数智能查询系统</title>
  <link rel="stylesheet" href="styles/admin.css">
  <style>
    .login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .login-box {
      background: white; border-radius: 12px; padding: 40px 36px;
      width: 400px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-logo { font-size: 40px; margin-bottom: 12px; }
    .login-title { font-size: 20px; font-weight: 600; }
    .login-subtitle { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }
    .login-btn {
      width: 100%; padding: 10px; background: var(--primary); color: white;
      border: none; border-radius: var(--radius-sm); font-size: 15px;
      font-weight: 500; cursor: pointer; margin-top: 8px;
    }
    .login-btn:hover { background: var(--primary-dark); }
    .role-options { display: flex; gap: 12px; margin: 16px 0; }
    .role-option {
      flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-md);
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .role-option.active { border-color: var(--primary); background: var(--primary-bg); }
    .role-option-icon { font-size: 24px; margin-bottom: 4px; }
    .role-option-label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">⚙️</div>
        <div class="login-title">后台管理系统</div>
        <div class="login-subtitle">产品参数智能查询 · 管理控制台</div>
      </div>

      <div class="form-group">
        <label class="form-label">选择角色</label>
        <div class="role-options">
          <div class="role-option active" data-role="admin" onclick="selectRole(this)">
            <div class="role-option-icon">👨‍💼</div>
            <div class="role-option-label">管理员</div>
          </div>
          <div class="role-option" data-role="engineer" onclick="selectRole(this)">
            <div class="role-option-icon">👨‍🔧</div>
            <div class="role-option-label">工程师</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">账号</label>
        <input class="form-input" id="username" value="admin" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="password" type="password" value="123456" placeholder="请输入密码">
      </div>

      <button class="login-btn" onclick="handleLogin()">登录管理后台</button>
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-tertiary)">
        💡 演示模式：选择角色后直接点击登录
      </div>
    </div>
  </div>

  <script src="../scripts/utils.js"></script>
  <script src="../scripts/mock-data.js"></script>
  <script src="../scripts/storage.js"></script>
  <script>
    let selectedRole = 'admin';

    function selectRole(el) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      selectedRole = el.dataset.role;
    }

    function handleLogin() {
      initAllData();
      const userMap = { admin: 'u001', engineer: 'u004' };
      const user = MockData.users.find(u => u.id === userMap[selectedRole]);
      if (user) {
        UserStorage.save({ ...user, isAdmin: true });
        window.location.href = 'dashboard.html';
      }
    }

    if (UserStorage.isLoggedIn() && UserStorage.get().isAdmin) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
