<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 管理后台</title>
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-logo"><span class="sidebar-logo-icon">⚙️</span><span>管理后台</span></div>
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item"><span class="menu-icon">📊</span>仪表盘</a>
        <a href="users.html" class="menu-item active"><span class="menu-icon">👥</span>用户管理</a>
        <a href="approval.html" class="menu-item"><span class="menu-icon">✅</span>报价审批</a>
        <a href="prices.html" class="menu-item"><span class="menu-icon">💰</span>价格管理</a>
        <a href="documents.html" class="menu-item"><span class="menu-icon">📚</span>文档管理</a>
        <a href="verify.html" class="menu-item"><span class="menu-icon">🔍</span>数据校验</a>
      </div>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">用户管理</div>
        <div class="topbar-user">
          <span class="topbar-avatar">👨‍💼</span>
          <span id="adminName">管理员</span>
          <button class="topbar-logout" onclick="UserStorage.logout();location.href='index.html'">退出</button>
        </div>
      </div>

      <div class="page-container">
        <div class="page-header">
          <div class="page-title">用户列表</div>
          <button class="btn btn-primary" onclick="openAddUser()">+ 新增用户</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <table class="data-table">
            <thead>
              <tr>
                <th>用户名</th>
                <th>角色</th>
                <th>部门</th>
                <th>手机号</th>
                <th>折扣权限</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTable"></tbody>
          </table>
        </div>

        <!-- 角色权限说明 -->
        <div class="card" style="margin-top:16px">
          <div class="card-title">🔐 角色权限配置</div>
          <table class="data-table">
            <thead>
              <tr><th>角色</th><th>查询</th><th>报价</th><th>审批</th><th>知识库管理</th><th>用户管理</th><th>最大折扣</th></tr>
            </thead>
            <tbody>
              <tr><td><span class="tag tag-admin">超级管理员</span></td><td>✅</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td><td>无限制</td></tr>
              <tr><td><span class="tag tag-sales">销售经理</span></td><td>✅</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td><td>8折</td></tr>
              <tr><td><span class="tag tag-sales">业务员</span></td><td>✅</td><td>✅</td><td>❌</td><td>❌</td><td>❌</td><td>9折</td></tr>
              <tr><td><span class="tag tag-engineer">工程师</span></td><td>✅</td><td>❌</td><td>❌</td><td>✅</td><td>❌</td><td>-</td></tr>
              <tr><td><span class="tag tag-inactive">只读用户</span></td><td>✅</td><td>❌</td><td>❌</td><td>❌</td><td>❌</td><td>-</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增/编辑用户弹窗 -->
  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">新增用户</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input class="form-input" id="editName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input class="form-input" id="editPhone" placeholder="请输入手机号">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">角色</label>
          <select class="form-select" id="editRole">
            <option value="admin">超级管理员</option>
            <option value="manager">销售经理</option>
            <option value="sales">业务员</option>
            <option value="engineer">工程师</option>
            <option value="readonly">只读用户</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">部门</label>
          <input class="form-input" id="editDept" placeholder="请输入部门">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">最大折扣权限</label>
        <select class="form-select" id="editDiscount">
          <option value="1.0">无折扣权限</option>
          <option value="0.95">9.5折</option>
          <option value="0.9">9折</option>
          <option value="0.85">8.5折</option>
          <option value="0.8">8折</option>
          <option value="0">无限制</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveUser()">保存</button>
      </div>
    </div>
  </div>

  <script src="../scripts/utils.js"></script>
  <script src="../scripts/mock-data.js"></script>
  <script src="../scripts/storage.js"></script>
  <script>
    if (!UserStorage.isLoggedIn() || !UserStorage.get().isAdmin) { window.location.href = 'index.html'; }
    initAllData();
    document.getElementById('adminName').textContent = UserStorage.get().name;

    const roleNames = { admin: '超级管理员', manager: '销售经理', sales: '业务员', engineer: '工程师', readonly: '只读用户' };
    const roleClasses = { admin: 'tag-admin', manager: 'tag-sales', sales: 'tag-sales', engineer: 'tag-engineer', readonly: 'tag-inactive' };
    const discountLimits = { admin: '无限制', manager: '8折', sales: '9折', engineer: '-', readonly: '-' };

    function renderUsers() {
      const users = MockData.users;
      document.getElementById('userTable').innerHTML = users.map(u => `
        <tr>
          <td><strong>${u.name}</strong></td>
          <td><span class="tag ${roleClasses[u.role] || ''}">${roleNames[u.role] || u.role}</span></td>
          <td>${u.department || '-'}</td>
          <td>${u.phone}</td>
          <td>${discountLimits[u.role] || '9折'}</td>
          <td><span class="tag tag-active">启用</span></td>
          <td>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline" onclick="editUser('${u.id}')">编辑</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">禁用</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    window.openAddUser = function() {
      document.getElementById('modalTitle').textContent = '新增用户';
      document.getElementById('editName').value = '';
      document.getElementById('editPhone').value = '';
      document.getElementById('editRole').value = 'sales';
      document.getElementById('editDept').value = '';
      document.getElementById('userModal').classList.add('show');
    };

    window.editUser = function(id) {
      const u = MockData.users.find(u => u.id === id);
      if (!u) return;
      document.getElementById('modalTitle').textContent = '编辑用户 - ' + u.name;
      document.getElementById('editName').value = u.name;
      document.getElementById('editPhone').value = u.phone;
      document.getElementById('editRole').value = u.role;
      document.getElementById('editDept').value = u.department || '';
      document.getElementById('userModal').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('userModal').classList.remove('show');
    };

    window.saveUser = function() {
      closeModal();
      showToast('用户信息已保存');
    };

    window.deleteUser = function(id) {
      if (confirm('确定要禁用该用户吗？')) {
        showToast('用户已禁用');
      }
    };

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = '✅ ' + msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    renderUsers();
  </script>
</body>
</html>
