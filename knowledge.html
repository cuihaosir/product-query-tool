<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>知识库管理 - 产品参数智能查询</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    .page-header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      padding: 16px 16px 50px; color: white;
    }
    .header-stats {
      display: flex; justify-content: space-around; text-align: center; margin-top: 16px;
    }
    .header-stat-num { font-size: 24px; font-weight: 700; }
    .header-stat-label { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .overview-cards {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin: -30px 16px 14px;
      position: relative; z-index: 10;
    }
    .overview-card {
      background: white; border-radius: var(--radius-md);
      padding: 14px; box-shadow: var(--shadow-md); text-align: center;
    }
    .overview-icon { font-size: 24px; margin-bottom: 4px; }
    .overview-value { font-size: 20px; font-weight: 700; color: var(--primary); }
    .overview-label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

    .section-title {
      font-size: 15px; font-weight: 600; padding: 16px 16px 8px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .doc-card {
      background: white; margin: 8px 16px; border-radius: var(--radius-md);
      padding: 14px; box-shadow: var(--shadow-sm);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .doc-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .doc-icon.pdf { background: #fff2f0; }
    .doc-icon.excel { background: #f6ffed; }
    .doc-icon.word { background: #e6f7ff; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-meta { font-size: 11px; color: var(--text-tertiary); display: flex; gap: 8px; flex-wrap: wrap; }
    .doc-status {
      margin-top: 6px; display: inline-block;
      padding: 2px 8px; border-radius: 10px; font-size: 11px;
    }
    .doc-status.parsed { background: #f6ffed; color: #52c41a; }
    .doc-status.parsing { background: #e6f7ff; color: #1890ff; }
    .doc-status.failed { background: #fff2f0; color: #ff4d4f; }

    .upload-area {
      margin: 16px; padding: 32px 16px; border: 2px dashed var(--border);
      border-radius: var(--radius-md); text-align: center;
      background: white; cursor: pointer; transition: all 0.2s;
    }
    .upload-area:hover { border-color: var(--primary); background: var(--primary-bg); }
    .upload-area:active { transform: scale(0.98); }
    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
    .upload-hint { font-size: 12px; color: var(--text-tertiary); }

    .progress-item {
      margin: 8px 16px; padding: 12px; background: white;
      border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    }
    .progress-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .progress-name { font-size: 13px; font-weight: 500; }
    .progress-pct { font-size: 12px; color: var(--primary); font-weight: 600; }
    .progress-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.5s; }
  </style>
</head>
<body>
  <div class="container">
    <div class="navbar" style="position:absolute;top:0;left:0;right:0;background:transparent;border:none;z-index:20;color:white">
      <button class="navbar-back" onclick="location.href='dashboard.html'" style="color:white">‹</button>
      <div class="navbar-title" style="color:white">知识库管理</div>
      <div style="width:32px"></div>
    </div>

    <div class="page-header" style="padding-top:56px">
      <div class="header-stats">
        <div>
          <div class="header-stat-num" id="statDocs">0</div>
          <div class="header-stat-label">文档总数</div>
        </div>
        <div>
          <div class="header-stat-num" id="statProducts">0</div>
          <div class="header-stat-label">产品型号</div>
        </div>
        <div>
          <div class="header-stat-num" id="statParsed">0%</div>
          <div class="header-stat-label">解析完成率</div>
        </div>
      </div>
    </div>

    <!-- 概览卡片 -->
    <div class="overview-cards">
      <div class="overview-card">
        <div class="overview-icon">📄</div>
        <div class="overview-value" id="ovPdf">0</div>
        <div class="overview-label">PDF文档</div>
      </div>
      <div class="overview-card">
        <div class="overview-icon">📊</div>
        <div class="overview-value" id="ovExcel">0</div>
        <div class="overview-label">Excel表格</div>
      </div>
    </div>

    <!-- 上传区域 -->
    <div class="upload-area" onclick="simulateUpload()">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击或拖拽上传产品文档</div>
      <div class="upload-hint">支持 PDF / Word / Excel / 图片，单文件不超过100MB</div>
    </div>

    <!-- 解析进度（如果有正在解析的） -->
    <div id="parsingSection"></div>

    <!-- 文档列表 -->
    <div class="section-title">
      📚 已上传文档
      <span style="font-size:12px;color:var(--text-tertiary)" id="docCount">0份</span>
    </div>
    <div id="docList"></div>

    <div style="height:20px"></div>

    <!-- 底部Tab -->
    <div class="tabbar">
      <a href="dashboard.html" class="tabbar-item">
        <div class="tabbar-icon">🏠</div><div>首页</div>
      </a>
      <a href="chat.html" class="tabbar-item">
        <div class="tabbar-icon">🔍</div><div>查询</div>
      </a>
      <a href="quote.html" class="tabbar-item">
        <div class="tabbar-icon">📋</div><div>报价</div>
      </a>
      <a href="knowledge.html" class="tabbar-item active">
        <div class="tabbar-icon">📚</div><div>知识库</div>
      </a>
      <a href="analytics.html" class="tabbar-item">
        <div class="tabbar-icon">📊</div><div>统计</div>
      </a>
    </div>
  </div>

  <script src="scripts/utils.js"></script>
  <script src="scripts/mock-data.js"></script>
  <script src="scripts/storage.js"></script>
  <script>
    if (!UserStorage.isLoggedIn()) { window.location.href = 'index.html'; }
    initAllData();

    const docs = DocStorage.getAll();
    const docStats = DocStorage.getStats();
    const products = ProductStorage.getAll();

    // 渲染统计
    document.getElementById('statDocs').textContent = docStats.total;
    document.getElementById('statProducts').textContent = products.length;
    const parsedRate = docStats.total > 0 ? Math.round(docStats.parsed / docStats.total * 100) : 0;
    document.getElementById('statParsed').textContent = parsedRate + '%';

    // 概览
    document.getElementById('ovPdf').textContent = docs.filter(d => d.type === 'pdf').length;
    document.getElementById('ovExcel').textContent = docs.filter(d => d.type === 'excel').length;
    document.getElementById('docCount').textContent = docs.length + '份';

    // 解析进度
    const parsingDocs = docs.filter(d => d.status === 'parsing');
    if (parsingDocs.length > 0) {
      document.getElementById('parsingSection').innerHTML = `
        <div class="section-title">⏳ 正在解析</div>
        ${parsingDocs.map(d => `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-name">${d.name}</span>
              <span class="progress-pct">67%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:67%"></div></div>
          </div>
        `).join('')}
      `;
    }

    // 文档列表
    function renderDocList() {
      const typeIcons = { pdf: '📕', excel: '📊', word: '📘', image: '🖼️' };
      const typeClasses = { pdf: 'pdf', excel: 'excel', word: 'word' };

      document.getElementById('docList').innerHTML = docs.map(d => `
        <div class="doc-card">
          <div class="doc-icon ${typeClasses[d.type] || 'pdf'}">${typeIcons[d.type] || '📄'}</div>
          <div class="doc-info">
            <div class="doc-name">${d.name}</div>
            <div class="doc-meta">
              <span>${d.size || '-'}</span>
              ${d.pages ? `<span>${d.pages}页</span>` : ''}
              <span>收录${d.products_count || 0}个型号</span>
            </div>
            <div>
              <span class="doc-status ${d.status}">${d.status === 'parsed' ? '✓ 已解析' : d.status === 'parsing' ? '⏳ 解析中' : '✗ 解析失败'}</span>
              <span style="font-size:11px;color:var(--text-tertiary);margin-left:8px">上传于 ${Utils.formatDate(d.upload_time)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    renderDocList();

    // 模拟上传
    window.simulateUpload = function() {
      Utils.toast('模拟上传中...');
      setTimeout(() => {
        const newDoc = {
          id: Utils.generateId(),
          name: '新产品参数表_' + Utils.formatDate(new Date().toISOString(), 'MMDD') + '.pdf',
          type: 'pdf',
          pages: 15,
          size: '3.2MB',
          status: 'parsing',
          products_count: 0,
          upload_time: new Date().toISOString(),
          updated_at: new Date().toISOString()
        };
        const allDocs = DocStorage.getAll();
        allDocs.unshift(newDoc);
        DocStorage.save(allDocs);
        Utils.toast('文档上传成功，正在解析...');
        
        // 模拟解析完成
        setTimeout(() => {
          const updatedDocs = DocStorage.getAll();
          const idx = updatedDocs.findIndex(d => d.id === newDoc.id);
          if (idx !== -1) {
            updatedDocs[idx].status = 'parsed';
            updatedDocs[idx].products_count = 12;
            DocStorage.save(updatedDocs);
            Utils.toast('解析完成！新增12个产品型号');
            location.reload();
          }
        }, 3000);
      }, 1000);
    };
  </script>
</body>
</html>
